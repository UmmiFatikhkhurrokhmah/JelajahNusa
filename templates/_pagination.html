{% if page_obj.has_other_pages %}
<nav aria-label="Navigasi halaman" class="mt-4">
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Sebelumnya">&laquo;</a></li>
    {% endif %}
    {% for n in page_obj.paginator.page_range %}
      <li class="page-item {% if n == page_obj.number %}active{% endif %}"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ n }}">{{ n }}</a></li>
    {% endfor %}
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Berikutnya">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
