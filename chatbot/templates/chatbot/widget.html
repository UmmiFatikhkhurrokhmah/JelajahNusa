<div id="jn-chat"
     data-url-kirim="{% url 'chatbot_kirim' %}"
     data-url-riwayat="{% url 'chatbot_riwayat' %}"
     data-url-hapus="{% url 'chatbot_hapus' %}">
  <button class="chat-fab" id="chatToggle" type="button" aria-label="Buka JelajahNusa AI Assistant" aria-expanded="false" aria-controls="chatPanel">
    <i class="fa-solid fa-comments"></i>
  </button>

  <section class="chat-panel" id="chatPanel" role="dialog" aria-label="JelajahNusa AI Assistant">
    <div class="chat-head">
      <span class="avatar"><i class="fa-solid fa-robot"></i></span>
      <div>
        <strong>JelajahNusa AI Assistant</strong>
        <span class="chat-mode" id="chatMode">Memuat…</span>
      </div>
      <div class="tools">
        <button class="icon-btn" type="button" id="chatClear" title="Hapus percakapan" aria-label="Hapus percakapan"><i class="fa-solid fa-trash-can"></i></button>
        <button class="icon-btn" type="button" id="chatClose" title="Tutup" aria-label="Tutup chat"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div class="chat-body" id="chatBody" aria-live="polite">
      <div class="typing" id="chatTyping" aria-label="Asisten sedang mengetik"><span></span><span></span><span></span></div>
    </div>

    <div class="chat-quick">
      <button type="button" data-chat-prompt="Apa itu TF-IDF?">TF-IDF</button>
      <button type="button" data-chat-prompt="Jelaskan Cosine Similarity">Cosine Similarity</button>
      <button type="button" data-chat-prompt="Kota apa saja yang ada di dataset?">Daftar kota</button>
      <button type="button" data-chat-prompt="Bagaimana cara memakai website ini?">Cara pakai</button>
    </div>

    <form class="chat-form" id="chatForm" autocomplete="off">
      <input type="text" id="chatInput" maxlength="500" placeholder="Tulis pertanyaanmu…" aria-label="Pesan">
      <button type="submit" id="chatSend" aria-label="Kirim"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </section>
</div>
